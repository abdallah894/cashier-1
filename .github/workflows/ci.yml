name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # dummy values: the build and the tests never reach a real project
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: dummy-publishable-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Secrets hygiene
        run: npx tsx scripts/check-secrets.ts
      - name: Migration validation
        run: npx tsx scripts/validate-migrations.ts
      - name: Tests (database, flows, offline, AI, ops)
        run: npm run test:all
      - run: npm run build
